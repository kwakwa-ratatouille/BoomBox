# Test de l'appli Android sur un téléphone virtuel : installe le dernier APK publié, l'ouvre, lance l'écran
# d'accueil puis récupère le journal système (plantages, erreurs). Le résultat apparaît dans les annotations
# de l'exécution (lisibles sans connexion). Lancé à la main ou quand ce fichier change.
name: Test Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-test.yml']

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: APK
        run: curl -sL -o boombox.apk https://github.com/kwakwa-ratatouille/BoomBox/releases/latest/download/Boombox.apk && ls -l boombox.apk
      - name: Téléphone virtuel
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r boombox.apk > install.txt 2>&1 || true
            cat install.txt
            adb logcat -c || true
            adb shell monkey -p app.boombox.music -c android.intent.category.LAUNCHER 1 > launch.txt 2>&1 || true
            sleep 50
            adb shell pidof app.boombox.music > pid1.txt 2>/dev/null || true
            adb shell am force-stop app.boombox.music || true
            sleep 3
            adb shell monkey -p app.boombox.music -c android.intent.category.LAUNCHER 1 > /dev/null 2>&1 || true
            sleep 40
            adb shell pidof app.boombox.music > pid.txt 2>/dev/null || true
            adb logcat -d > logcat.txt 2>/dev/null || true
            adb shell screencap -p /sdcard/s1.png > /dev/null 2>&1 || true
            adb pull /sdcard/s1.png s1.png > /dev/null 2>&1 || true
      - name: Résultat
        if: always()
        run: |
          echo "::notice title=Installation::$(cat install.txt 2>/dev/null | tr '\n' ' ') | lancement: $(cat launch.txt 2>/dev/null | tr '\n' ' ' | tail -c 300)"
          [ -f logcat.txt ] || { echo "::error::pas de journal"; exit 0; }
          echo "Processus vivant après 45 s : $( [ -s pid.txt ] && echo oui || echo NON )"
          enc() { python3 -c "import sys;print(sys.stdin.read().replace('%','%25').replace('\r','').replace('\n','%0A')[:60000])"; }
          if grep -q "FATAL EXCEPTION\|AndroidRuntime" logcat.txt; then
            msg=$(grep -A40 "FATAL EXCEPTION" logcat.txt | head -60 | enc)
            echo "::error title=Plantage::$msg"
          else
            echo "::notice title=Pas de plantage Java::Processus vivant : $( [ -s pid.txt ] && echo oui || echo NON )"
          fi
          nat=$(grep -E "DEBUG   :|Fatal signal|tombstone|ANR in|E AndroidRuntime|Process app.boombox.music.*died|has died|crash" logcat.txt | grep -v "Access denied" | head -50 | enc)
          [ -n "$nat" ] && echo "::error title=Natif / ANR::$nat"
          web=$(grep -E "Capacitor/Console|chromium|E Capacitor|ActivityManager.*boombox|Displayed app.boombox" logcat.txt | grep -v " V " | tail -70 | cut -c1-400 | enc)
          echo "::warning title=Journal appli::$web"
      - name: Capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test
          path: |
            logcat.txt
            s1.png
