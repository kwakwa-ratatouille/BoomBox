# Compile l'appli mobile Boombox à chaque modification (ou à la main : onglet Actions → « Appli mobile » → Run workflow)
# - iPhone : fichier .ipa non signé (SideStore le signe sur le téléphone avec ton identifiant Apple gratuit)
# - Android : fichier .apk à installer directement
# Chaque compilation est publiée dans « Releases », avec source.json pour les mises à jour dans SideStore.
name: Appli mobile

on:
  push:
    branches: [main]
    paths: ['public/**', 'mobile/**', 'server/**', 'scripts/**', 'resources/**', 'capacitor.config.json', 'package.json', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}
  # Étiquette au format « v1.0.N » : GitHub trie alors les versions dans le bon ordre (build-9 passait avant build-14)
  TAG: v1.0.${{ github.run_number }}

jobs:
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dépendances
        run: npm ci --ignore-scripts
      - name: Serveur embarqué
        run: node scripts/build-mobile.mjs
      - name: Projet iOS + icônes
        run: |
          npx cap add ios
          npx --yes @capacitor/assets@3.0.5 generate --ios --assetPath resources --iconBackgroundColor '#b07cf7' --splashBackgroundColor '#131019' --splashBackgroundColorDark '#131019' || echo "icônes : on garde celles par défaut"
      - name: Réglages iOS (lecture en arrière-plan, lien boombox://, version)
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string app.boombox.music" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string boombox" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string sidestore" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          # Lecture par le PC sur le même Wi-Fi (adresse http locale) : réseau local autorisé
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Boombox lit ta musique par ton PC quand il est sur le même Wi-Fi.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Boombox" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Boombox" "$PLIST"
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $VERSION;/g; s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = ${{ github.run_number }};/g" ios/App/App.xcodeproj/project.pbxproj
      - name: Synchronisation Capacitor
        run: npx cap sync ios
      - name: Compilation (non signée)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP" && zip -qry Boombox.ipa Payload
      - name: Source SideStore (mises à jour automatiques)
        run: |
          SIZE=$(stat -f%z "$RUNNER_TEMP/Boombox.ipa")
          node -e '
            const [repo, version, tag, size] = process.argv.slice(1);
            const src = {
              name: "Boombox", identifier: "app.boombox.source", subtitle: "Ta musique, partout",
              iconURL: `https://raw.githubusercontent.com/${repo}/main/resources/icon.png`, tintColor: "b07cf7",
              apps: [{
                name: "Boombox", bundleIdentifier: "app.boombox.music", developerName: "Boombox",
                subtitle: "Ta musique, partout", localizedDescription: "Lecteur de musique perso : playlists synchronisées, hors ligne, Jam, automix.",
                iconURL: `https://raw.githubusercontent.com/${repo}/main/resources/icon.png`, tintColor: "b07cf7",
                versions: [{ version, date: new Date().toISOString(), size: Number(size), minOSVersion: "15.0",
                  downloadURL: `https://github.com/${repo}/releases/download/${tag}/Boombox.ipa` }],
                appPermissions: { entitlements: [], privacy: {} }
              }],
              news: []
            };
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/source.json", JSON.stringify(src, null, 2));
          ' "${{ github.repository }}" "$VERSION" "$TAG" "$SIZE"
      - name: Publication
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Boombox ${{ env.VERSION }}
          make_latest: true
          files: |
            ${{ runner.temp }}/Boombox.ipa
            ${{ runner.temp }}/source.json

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Dépendances
        run: npm ci --ignore-scripts
      - name: Serveur embarqué
        run: node scripts/build-mobile.mjs
      - name: Projet Android + icônes
        run: |
          npx cap add android
          npx --yes @capacitor/assets@3.0.5 generate --android --assetPath resources --iconBackgroundColor '#b07cf7' --splashBackgroundColor '#131019' || echo "icônes par défaut"
      - name: Lien boombox:// et version
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</activity>#  <intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><category android:name="android.intent.category.BROWSABLE" /><data android:scheme="boombox" /></intent-filter>\n        </activity>#' "$M"
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          # yt-dlp embarqué : bibliothèques natives extraites, et seulement les processeurs des téléphones récents (taille réduite)
          sed -i 's#<application#<application android:extractNativeLibs="true"#' "$M"
          printf '\nandroid {\n    packagingOptions { jniLibs { useLegacyPackaging = true } }\n    defaultConfig { ndk { abiFilters "arm64-v8a", "armeabi-v7a" } }\n}\n' >> android/app/build.gradle
          # youtubedl-android demande Android 7 minimum et une compilation récente
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/; s/compileSdkVersion = [0-9]*/compileSdkVersion = 35/' android/variables.gradle
          cat android/variables.gradle
          npx cap sync android
      - name: Compilation
        run: |
          cd android
          # En cas d'échec, les vraies erreurs remontent dans les annotations de GitHub (lisibles sans connexion)
          if ! ./gradlew assembleDebug --no-daemon --warning-mode none > "$RUNNER_TEMP/gradle.log" 2>&1; then
            grep -E "error:|e: |What went wrong|FAILURE|requires|Could not|symbol|location:|^> [^T]" "$RUNNER_TEMP/gradle.log" | grep -v "> Task" | head -n 30 | while IFS= read -r l; do echo "::error::$l"; done
            tail -n 40 "$RUNNER_TEMP/gradle.log"
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Boombox.apk"
      - name: Publication
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Boombox ${{ env.VERSION }}
          files: ${{ runner.temp }}/Boombox.apk

  # Ménage : on ne garde que les 3 versions les plus récentes (et leurs étiquettes), une fois les deux appli publiées
  cleanup:
    needs: [ios, android]
    runs-on: ubuntu-latest
    steps:
      - name: Suppression des anciennes versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 200 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r tag; do
            echo "Suppression de $tag"
            gh release delete "$tag" --cleanup-tag --yes || true
          done