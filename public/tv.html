<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Chromecast : l'appli réceptrice de Boombox est cast.html (c'est elle qui répond au téléphone) ; si la télé arrive ici,
       elle y part tout de suite (sinon le téléphone attendait en vain et affichait « même Wi-Fi ? ») -->
  <script>if (/CrKey/.test(navigator.userAgent) && !/[?&]notv/.test(location.search)) location.replace('/cast.html' + location.search);</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#131019">
  <title>Boombox · Télé</title>
  <link rel="icon" href="/assets/favicon-32.png" type="image/png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    html, body { height: 100%; overflow: hidden; background: #131019; cursor: none; }
    .tv-pair { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 40px; isolation: isolate; overflow: hidden; }
    .tv-pair > * { position: relative; z-index: 3; }
    .tv-pair h1 { font-size: clamp(32px, 4vw, 60px); font-weight: 900; margin: 0; }
    .tv-pair p { color: var(--muted); font-size: clamp(18px, 2vw, 28px); margin: 0; max-width: 1000px; }
    .tv-pin { font-size: clamp(90px, 14vw, 200px); font-weight: 900; letter-spacing: .15em; color: #fff; line-height: 1; padding: 10px 40px; border-radius: 28px; background: rgba(255, 255, 255, .08); }
    .tv-pin + p b { color: var(--accent, #b07cf7); }
    .tv-alt { margin-top: 18px; display: flex; gap: 10px; align-items: center; justify-content: center; }
    .tv-alt input { font-size: 22px; width: 200px; text-transform: uppercase; letter-spacing: .15em; text-align: center; }
    .tv-alt .btn { font-size: 20px; }
    .tv-progress { height: 6px; border-radius: 6px; background: rgba(255, 255, 255, .15); overflow: hidden; margin-top: 14px; max-width: 520px; }
    .tv-progress i { display: block; height: 100%; background: var(--accent, #b07cf7); width: 0; transition: width 1s linear; }
    .party-screen { cursor: none; }
    .party-screen .ps-close, .party-screen .ps-btns { display: none; }
  </style>
</head>
<body>
  <div id="tv"></div>
  <script type="module" src="/js/tv.js"></script>
</body>
</html>
