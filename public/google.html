<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connexion à Boombox</title>
<meta name="theme-color" content="#131019">
<link rel="icon" href="/assets/favicon-32.png?v=2">
<style>
  :root { --bg: #131019; --card: #1e1b26; --text: #f4f2f8; --muted: #a9a3b5; --accent: #b07cf7; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding: 16px; }
  .card { background: var(--card); border-radius: 22px; padding: 32px 24px; width: 100%; max-width: 420px; text-align: center; }
  img { width: 76px; height: 76px; border-radius: 18px; }
  h1 { font-size: 24px; margin: 14px 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; }
  button, a.btn { display: flex; gap: 10px; align-items: center; justify-content: center; width: 100%; border: 0; border-radius: 14px; padding: 15px; font: 700 17px/1 inherit; cursor: pointer; text-decoration: none; }
  .google { background: #fff; color: #1f1f1f; }
  .back { background: var(--accent); color: #131019; margin-top: 12px; }
  .err { background: rgba(255, 90, 90, .15); color: #ff9b9b; border-radius: 12px; padding: 10px 14px; font-size: 15px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <img src="/assets/app-icon-1024.png?v=2" alt="">
  <div id="wait">
    <h1>Connexion à Boombox</h1>
    <p>Connecte-toi avec Google ici, puis reviens dans Boombox : il se connectera tout seul.</p>
    <p class="err hidden" id="err"></p>
    <button class="google" id="go"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continuer avec Google</button>
  </div>
  <div id="ok" class="hidden">
    <h1>✅ C'est bon !</h1>
    <p>Retourne dans Boombox : tu y es déjà connecté. Tu peux fermer cette page.</p>
    <a class="btn back" href="boombox://">Revenir dans Boombox</a>
  </div>
  <div id="bad" class="hidden">
    <h1>Lien incomplet</h1>
    <p>Relance la connexion Google depuis Boombox.</p>
  </div>
</div>
<script type="module">
// Page ouverte dans le vrai navigateur par Boombox (iPhone, Android, téléphone sur le Wi-Fi) : connexion Google,
// puis le jeton est chiffré avec la clé donnée dans l'adresse et déposé pour l'appli, qui se connecte toute seule.
import { initializeApp } from '/vendor/firebase/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from '/vendor/firebase/firebase-auth.js';
import { getFirestore, doc, setDoc, serverTimestamp } from '/vendor/firebase/firebase-firestore.js';
import { firebaseConfig } from '/js/firebase-config.js';

const $ = (id) => document.getElementById(id);
const p = new URLSearchParams(location.hash.slice(1));
const id = p.get('id');
const k = p.get('k');
if (!id || !k) {
  $('wait').classList.add('hidden');
  $('bad').classList.remove('hidden');
}
const unb64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
const b64 = (o) => btoa(String.fromCharCode(...new Uint8Array(o))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const ERR = { 'auth/popup-closed-by-user': 'Connexion annulée.', 'auth/popup-blocked': 'La fenêtre Google a été bloquée : réessaie.', 'auth/operation-not-allowed': 'La connexion Google n’est pas encore activée pour Boombox.' };

$('go').onclick = async () => {
  $('go').disabled = true;
  $('err').classList.add('hidden');
  try {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    const res = await signInWithPopup(auth, provider);
    const c = GoogleAuthProvider.credentialFromResult(res);
    if (!c?.idToken && !c?.accessToken) throw new Error('Google n’a pas renvoyé de jeton.');
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await crypto.subtle.importKey('raw', unb64(k), 'AES-GCM', false, ['encrypt']);
    const enc = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify({ i: c.idToken || null, a: c.accessToken || null })));
    const all = new Uint8Array(12 + enc.byteLength);
    all.set(iv);
    all.set(new Uint8Array(enc), 12);
    await setDoc(doc(db, 'authRelay', id), { d: b64(all), t: serverTimestamp() });
    await signOut(auth).catch(() => {});
    $('wait').classList.add('hidden');
    $('ok').classList.remove('hidden');
  } catch (e) {
    $('err').textContent = ERR[e.code] || e.message;
    $('err').classList.remove('hidden');
  } finally {
    $('go').disabled = false;
  }
};
</script>
</body>
</html>
